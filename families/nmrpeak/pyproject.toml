[project]
name = "nmrpeak-family-runtime"
version = "0"
requires-python = "==3.11.*"
dependencies = [
    # Exact direct dependencies for the pinned generation path and for modules
    # NMRPeak imports before the worker reaches that path.
    "lmdb==1.4.1",
    "matplotlib==3.7.2",
    "numpy==1.24.4",
    "pandas==1.5.2",
    "rdkit==2024.9.6",
    "scikit-learn==1.3.0",
    "scipy==1.11.1",
    "smirk==0.1.0",
    "tqdm==4.66.1",
    "transformers==4.55.4",
]

[dependency-groups]
cpu-x86_64 = [
    "torch @ https://download.pytorch.org/whl/cpu/torch-2.3.0%2Bcpu-cp311-cp311-linux_x86_64.whl#sha256=97a38b25ee0e3d020691e7846efbca62a3d8a57645c027dcb5ba0adfec36fe55",
]
