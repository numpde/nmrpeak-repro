[project]
name = "nmrpeak-family-runtime"
version = "0"
requires-python = "==3.12.*"
dependencies = [
    # Exact direct dependencies for the pinned generation path and for modules
    # NMRPeak imports before the worker reaches that path.
    "lmdb==1.5.1",
    "matplotlib==3.8.4",
    "numpy==1.26.4",
    "pandas==2.1.4",
    "rdkit==2024.9.6",
    "scikit-learn==1.5.0",
    "scipy==1.11.4",
    "smirk==0.1.0",
    "tqdm==4.66.3",
    "transformers==4.55.4",
]

[dependency-groups]
benchmark-cu128 = [
    "torch @ https://download.pytorch.org/whl/cu128/torch-2.10.0%2Bcu128-cp312-cp312-manylinux_2_28_x86_64.whl#sha256=628e89bd5110ced7debee2a57c69959725b7fbc64eab81a39dd70e46c7e28ba5",
]
cpu-x86_64 = [
    "torch @ https://download.pytorch.org/whl/cpu/torch-2.3.0%2Bcpu-cp312-cp312-linux_x86_64.whl#sha256=a8982e52185771591dad577a124a7770f72f288f8ae5833317b1e329c0d2f07e",
]
