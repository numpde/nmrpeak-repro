x-nmrpeak-sandbox: &nmrpeak-sandbox
  image: nmrpeak-sandbox:torch2.3-cpu
  build:
    context: .
    dockerfile: Dockerfile
    network: ${NMRPEAK_BUILD_NETWORK:-default}
    args:
      TORCH_INDEX_URL: https://download.pytorch.org/whl/cpu
      HTTP_PROXY: ${NMRPEAK_BUILD_HTTP_PROXY:-}
      HTTPS_PROXY: ${NMRPEAK_BUILD_HTTP_PROXY:-}
      http_proxy: ${NMRPEAK_BUILD_HTTP_PROXY:-}
      https_proxy: ${NMRPEAK_BUILD_HTTP_PROXY:-}
      NO_PROXY: ""
      no_proxy: ""
  init: true
  network_mode: none
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  user: "65532:65532"
  working_dir: /opt/nmrpeak
  pids_limit: 256
  mem_limit: ${NMRPEAK_MEMORY_LIMIT:-32g}
  cpus: ${NMRPEAK_CPU_LIMIT:-8.0}
  shm_size: 1g
  ulimits:
    core: 0
    nofile:
      soft: 4096
      hard: 4096
  environment:
    HOME: /home/sandbox
    MPLCONFIGDIR: /tmp/matplotlib
    HF_HOME: /tmp/huggingface
    TORCH_HOME: /tmp/torch
    WANDB_MODE: offline
    WANDB_DISABLED: "true"
    TOKENIZERS_PARALLELISM: "false"
  tmpfs:
    - /tmp:rw,nosuid,nodev,noexec,size=2g,uid=65532,gid=65532,mode=1777
    - /home/sandbox:rw,nosuid,nodev,noexec,size=64m,uid=65532,gid=65532,mode=700

services:
  # Default: imports the project and key dependencies without mounting or
  # deserializing any downloaded checkpoint.
  smoke:
    <<: *nmrpeak-sandbox
    command: ["python", "/opt/nmrpeak-tools/smoke_test.py"]

  # Extracts the ZIP into a Docker-managed volume. This service is networkless,
  # sees the host archive read-only, and has no access to the source checkout.
  extract-weights:
    <<: *nmrpeak-sandbox
    profiles: ["setup"]
    user: "0:0"
    mem_limit: 2g
    cpus: 2.0
    volumes:
      - ./weights/weights.zip:/input/weights.zip:ro
      - nmrpeak-hf-weights:/models
    command:
      - python
      - /opt/nmrpeak-tools/safe_extract.py
      - /input/weights.zip
      - /models
      - --member
      - weights/generation/all_weights/NMRexp_lr3e-4_bs16_gpu8_spec_trans_mol_bart_base_spec_trans_mol_60000_1000000/HF/checkpoint_best.pt

  extract-chf-weight:
    <<: *nmrpeak-sandbox
    profiles: ["setup"]
    user: "0:0"
    mem_limit: 2g
    cpus: 2.0
    volumes:
      - ./weights/weights.zip:/input/weights.zip:ro
      - nmrpeak-chf-weights:/models
    command:
      - python
      - /opt/nmrpeak-tools/safe_extract.py
      - /input/weights.zip
      - /models
      - --member
      - weights/generation/all_weights/NMRexp_lr3e-4_bs16_gpu8_spec_trans_mol_bart_base_spec_trans_mol_60000_1000000/CHF/checkpoint_best.pt

  # Explicit opt-in boundary for commands that deserialize checkpoints.
  # Models are read-only and results stay in a Docker-managed volume.
  checkpoint-cpu:
    <<: *nmrpeak-sandbox
    profiles: ["checkpoint"]
    environment:
      HOME: /home/sandbox
      NMRPEAK_WEIGHTS_DIR: /models/current
      NMRPEAK_OUTPUT_DIR: /output
      CUDA_VISIBLE_DEVICES: ""
      WANDB_MODE: offline
      WANDB_DISABLED: "true"
    volumes:
      - nmrpeak-hf-weights:/models:ro
      - nmrpeak-output:/output
    command: ["python", "/opt/nmrpeak-tools/smoke_test.py"]

  checkpoint-chf-cpu:
    <<: *nmrpeak-sandbox
    profiles: ["checkpoint"]
    environment:
      HOME: /home/sandbox
      NMRPEAK_WEIGHTS_DIR: /models/current
      NMRPEAK_OUTPUT_DIR: /output
      CUDA_VISIBLE_DEVICES: ""
      WANDB_MODE: offline
      WANDB_DISABLED: "true"
    volumes:
      - nmrpeak-chf-weights:/models:ro
      - nmrpeak-output:/output
    command: ["python", "/opt/nmrpeak-tools/smoke_test.py"]

  # GPU access increases the host-driver attack surface, so it is a separate
  # profile and never starts by default.
  checkpoint-gpu:
    <<: *nmrpeak-sandbox
    profiles: ["gpu"]
    image: nmrpeak-sandbox:torch2.3-cu121
    build:
      context: .
      dockerfile: Dockerfile
      network: ${NMRPEAK_BUILD_NETWORK:-default}
      args:
        TORCH_INDEX_URL: https://download.pytorch.org/whl/cu121
        HTTP_PROXY: ${NMRPEAK_BUILD_HTTP_PROXY:-}
        HTTPS_PROXY: ${NMRPEAK_BUILD_HTTP_PROXY:-}
        http_proxy: ${NMRPEAK_BUILD_HTTP_PROXY:-}
        https_proxy: ${NMRPEAK_BUILD_HTTP_PROXY:-}
        NO_PROXY: ""
        no_proxy: ""
    gpus: all
    environment:
      HOME: /home/sandbox
      NMRPEAK_WEIGHTS_DIR: /models/current
      NMRPEAK_OUTPUT_DIR: /output
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      WANDB_MODE: offline
      WANDB_DISABLED: "true"
    volumes:
      - nmrpeak-hf-weights:/models:ro
      - nmrpeak-output:/output
    command: ["python", "/opt/nmrpeak-tools/smoke_test.py"]

volumes:
  nmrpeak-hf-weights:
  nmrpeak-chf-weights:
  nmrpeak-output:
