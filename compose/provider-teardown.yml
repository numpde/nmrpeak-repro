# Teardown names only the fixed services and disposable session volumes.
services:
  provider:
    image: numpde/nmrpeak-teardown-only
    stop_grace_period: 600s
    volumes:
      - hf-session:/run/nmrpeak-provider/hf
      - chf-session:/run/nmrpeak-provider/chf

  hf-runner:
    image: numpde/nmrpeak-teardown-only
    stop_grace_period: 20s
    volumes:
      - hf-session:/run/nmrpeak

  chf-runner:
    image: numpde/nmrpeak-teardown-only
    stop_grace_period: 20s
    volumes:
      - chf-session:/run/nmrpeak

volumes:
  hf-session:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=1m,uid=65532,gid=65532,mode=0700
  chf-session:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=1m,uid=65532,gid=65532,mode=0700
