[build-system]
requires = ["setuptools==79.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "nmrpeak-provider-core"
version = "0.1.0"
description = "NMRPeak NMR API provider runtime"
requires-python = ">=3.12"
dependencies = [
    "cryptography==50.0.0",
    "httpx==0.28.1",
    "provider-core[api]==0.5.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["nmrpeak_provider"]

[tool.setuptools.package-data]
nmrpeak_provider = ["prompts/*.md", "policies/*.toml"]
