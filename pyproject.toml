[build-system]
requires = ["setuptools==79.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "nmrpeak-provider-core"
version = "0.1.0"
description = "NMRPeak NMR API provider runtime"
requires-python = ">=3.11"
dependencies = ["cryptography==49.0.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["nmrpeak_provider"]
